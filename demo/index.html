<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoCase Demo Day</title>
<meta name="description" content="A two-minute demo of NoCase: prepare your case before you pay a lawyer to.">
<meta property="og:title" content="NoCase Demo Day">
<meta property="og:description" content="A two-minute demo of NoCase: prepare your case before you pay a lawyer to.">
<meta property="og:image" content="https://nocase.org/assets/demo/poster.jpg">
<style>
  /* Demo Day page (2026-09-25). One button: plays the demo full screen, sound on.
     Safe to delete after the demo along with assets/demo/ and the nav link in /index.html. */
  @font-face { font-family: 'Schola'; src: url('/assets/fonts/schola-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Franklin'; src: url('/assets/fonts/lf-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Franklin'; src: url('/assets/fonts/lf-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  :root { --ink: #0f1216; --text: #e9e6df; --soft: #a9a8a3; --gold: #d9b86a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink); color: var(--text); font-family: 'Franklin', 'Helvetica Neue', Arial, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; }
  header { width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
  .logo { font-family: 'Schola', Georgia, serif; font-weight: 700; font-size: 22px; color: #fff; text-decoration: none; }
  .tag { font-size: 13px; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
  h1 { font-family: 'Schola', Georgia, serif; font-size: clamp(28px, 4vw, 44px); color: var(--gold); text-align: center; margin-bottom: 8px; }
  .sub { color: var(--soft); text-align: center; margin-bottom: 24px; font-size: 16px; }
  .stage { position: relative; width: 100%; max-width: 1100px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
           border: 1px solid rgba(217,184,106,0.45); box-shadow: 0 20px 60px -20px rgba(0,0,0,0.8); background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .play { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
          background: rgba(10,12,15,0.45); border: 0; cursor: pointer; color: #16120c; font: inherit; }
  .play span.btn { background: linear-gradient(#e6c887, #c9a24f); border: 1px solid #a8823a; border-radius: 999px;
          padding: 20px 40px; font-size: clamp(20px, 2.6vw, 28px); font-weight: 600; box-shadow: 0 0 28px -4px rgba(233,207,134,0.6); }
  .play:hover span.btn, .play:focus-visible span.btn { background: linear-gradient(#dcbb74, #b99140); }
  .play:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .play span.note { color: #fff; font-size: 15px; text-shadow: 0 1px 4px #000; }
  .play[hidden] { display: none; }
  footer { margin-top: 26px; color: var(--soft); font-size: 15px; text-align: center; }
  footer a { color: var(--gold); }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">NoCase</a>
  <span class="tag">Demo Day</span>
</header>
<h1>Prepare your case before you pay a lawyer to.</h1>
<p class="sub">A two-minute walkthrough, start to finish.</p>
<div class="stage">
  <video id="demo" src="/assets/demo/nocase-demo.mp4" poster="/assets/demo/poster.jpg" preload="auto" playsinline controls></video>
  <button class="play" id="play" type="button" aria-label="Play the demo">
    <span class="btn">&#9654;&nbsp; Play the demo</span>
    <span class="note">2 minutes &middot; sound on</span>
  </button>
</div>
<footer>Try it free at <a href="/">nocase.org</a></footer>
<script>
  (function () {
    var v = document.getElementById('demo'), b = document.getElementById('play');
    b.addEventListener('click', function () {
      b.hidden = true;
      v.muted = false; v.volume = 1; v.currentTime = 0;
      var p = v.play(); if (p && p.catch) p.catch(function () { b.hidden = false; });
      // Full screen for the room; if the browser refuses, it still plays in the page.
      try {
        if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
        else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
      } catch (e) {}
    });
    v.addEventListener('ended', function () {
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
      b.hidden = false;
    });
  })();
</script>
</body>
</html>
